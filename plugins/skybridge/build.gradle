plugins { id 'java' }
group = 'lan.skyblock'
version = '0.1.0-SNAPSHOT'
repositories { mavenCentral(); maven { url = 'https://repo.papermc.io/repository/maven-public/' } }
dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT'
    compileOnly files('../../server/plugins/BentoBox-3.17.0.jar', '../../server/plugins/BentoBox/addons/Challenges-1.8.1.jar')
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'com.google.code.gson:gson:2.11.0'
}
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
processResources { filesMatching('plugin.yml') { expand(version: project.version) } }
test { useJUnitPlatform() }
